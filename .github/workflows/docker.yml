name: docker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t petria-rag:ci .
